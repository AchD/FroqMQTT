name=FroqMQTT
version=2.0.0
author=Achim Diedrichs
maintainer=Achim Diedrichs
sentence=Lightweight MQTT 3.1.1 client that binds bool/float variables directly to MQTT topics.
paragraph=Publish on change, subscribe writes straight into your variable. Handles multiple MQTT packets per TCP segment, QoS 0/1/2, Last Will, keep-alive and auto-reconnect. Fixed RAM footprint, no heap use at runtime. Works with any Arduino Client (ESP8266, ESP32, Ethernet, WiFiNINA, TLS).
category=Communication
